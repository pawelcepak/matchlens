<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0f17">
<title>MatchLens 0.6</title>
<style>html,body{margin:0;background:#080c12;color:#fff;font-family:system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;color:#9ba8ba}</style>
</head>
<body><div class="boot">Ładowanie MatchLens 0.6…</div>
<script>
(async()=>{
  try{
    const r=await fetch('/index.html?base=06',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    html=html
      .replace('<title>MatchLens 0.5</title>','<title>MatchLens 0.6</title>')
      .replace('MatchLens <span class="muted">0.5</span>','MatchLens <span class="muted">0.6</span>')
      .replace('Advanced Model — ważona forma, rating siły ligi, home/away, H2H i porównanie z rynkiem.','Explainable Model — pokazuje skąd bierze prognozę i pozwala sprawdzić model na historii.')
      .replace('</body>','<script src="/v06.js?v=0601"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="boot">Nie udało się uruchomić MatchLens 0.6: '+String(e.message||e)+'</div>';
  }
})();
</script>
</body>
</html>
